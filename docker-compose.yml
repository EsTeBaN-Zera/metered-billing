services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: ./cmd/api
    environment:
      DATABASE_URL: postgres://app:app@db:5432/billing?sslmode=disable
      HTTP_ADDR: :8080
      API_VERSION: ${API_VERSION:-v1}
      KEY_PEPPER: ${KEY_PEPPER:-dev-key-pepper-change-me}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret-change-me}
      OPS_TOKEN: ${OPS_TOKEN:-dev-ops-token-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8088}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: ./cmd/worker
    environment:
      DATABASE_URL: postgres://app:app@db:5432/billing?sslmode=disable
      KEY_PEPPER: ${KEY_PEPPER:-dev-key-pepper-change-me}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: ./cmd/seed
    environment:
      DATABASE_URL: postgres://app:app@db:5432/billing?sslmode=disable
      KEY_PEPPER: ${KEY_PEPPER:-dev-key-pepper-change-me}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - seed

  web:
    build: ./web
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  pg_data:
